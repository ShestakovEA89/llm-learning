name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Только то, что нужно тестам без БД: полный requirements.txt тянет
      # torch/transformers (несколько ГБ) и для этих тестов не нужен.
      - name: Install test dependencies
        run: pip install pytest ruff psycopg2-binary python-dotenv docxtpl

      # Только реальные ошибки (синтаксис, неопределённые имена), без стиля.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      # Тесты, которым не нужна база. conftest.py требует, чтобы тестовая
      # строка подключения была задана и отличалась от боевой, поэтому
      # здесь стоят заглушки: реального подключения эти тесты не открывают.
      - name: Unit tests (no database)
        env:
          SUPABASE_CONNECTION: postgresql://ci:ci@localhost:5432/prod_placeholder
          SUPABASE_CONNECTION_TEST: postgresql://ci:ci@localhost:5432/test_placeholder
        run: pytest test_format_person_line.py test_validate_order_fields.py -v
