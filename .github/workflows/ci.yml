name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Чистый PostgreSQL на время прогона: тесты пишут в него, а не в Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py требует, чтобы тестовая строка была задана и отличалась
      # от боевой. Боевая здесь — заглушка: к ней никто не подключается.
      SUPABASE_CONNECTION: postgresql://postgres:postgres@localhost:5432/prod_placeholder
      SUPABASE_CONNECTION_TEST: postgresql://postgres:postgres@localhost:5432/pto_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Только то, что нужно тестам: полный requirements.txt тянет
      # torch/transformers (несколько ГБ), а тестам они не нужны.
      - name: Install test dependencies
        run: pip install pytest ruff psycopg2-binary python-dotenv docxtpl anthropic

      # Только реальные ошибки (синтаксис, неопределённые имена), без стиля.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      # Схема из дампа Supabase. Дамп содержит пару команд, которых нет в
      # чистом PostgreSQL (создание уже существующей схемы public), поэтому
      # psql запускается без остановки на первой ошибке, а следующим шагом
      # проверяется, что таблицы действительно создались.
      - name: Load schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d pto_test -q -f schema.sql
          count=$(psql -h localhost -U postgres -d pto_test -Atc "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "tables in public: $count"
          test "$count" -ge 14

      - name: Tests
        run: pytest -v
